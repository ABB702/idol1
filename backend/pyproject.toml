[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "idol-backend"
version = "0.1.0"
description = "Local-first knowledge agent powered by LangGraph"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "aiosqlite>=0.21,<1", "fastembed>=0.7,<1", "lancedb>=0.20,<1",
  "jieba>=0.42.1,<1", "beautifulsoup4>=4.13,<5", "markdownify>=1.1,<2", "tzdata>=2025.1",
  "trafilatura>=2.3,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.12,<1", "pyinstaller>=6.12,<7"]
studio = ["langgraph-cli[inmem]>=0.4.40,<0.5", "debugpy>=1.8,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["idol*"]

[tool.ruff]
target-version = "py311"
line-length = 110

